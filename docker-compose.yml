version: '3.9'

services:
  pattern-extractor:
    build: .
    container_name: pattern-extractor
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATASET_ROOT=/datasets
    volumes:
      - ./datasets:/datasets:rw
    command: python3 -m uvicorn server.api:app --host 0.0.0.0 --port 8000
